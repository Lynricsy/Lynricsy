<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="agent handshake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#efe8ef"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9821a"/>
      <stop offset="1" stop-color="#b34a63"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; }
    .t { fill: #201a22; }
    .d { fill: #5c5158; }
    .f { fill: #8d8189; }
    .title { font-size: 13px; font-weight: 600; letter-spacing: .06em; }
    .kpi { font-size: 22px; font-weight: 700; }
    .cap { font-size: 9.5px; letter-spacing: .12em; }
    .sm { font-size: 10.5px; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .drift { animation: drift 14s linear infinite; }
    .glow { animation: glow 4.5s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.22,1,.36,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .drift, .glow, .grow { animation: none; }
      .grow { transform: none; }
    }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .line { animation: reveal .5s ease-out both; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; transform: none; }
      .caret { animation: none; }
    }
  </style>
  <rect width="880" height="250" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="879" height="249" rx="13.5" fill="none" stroke="#ded3d0"/>
  <rect x="14" y="14" width="3" height="14" rx="1.5" fill="url(#edge)"/>
  <text class="t title" x="26" y="25">agent handshake</text>
  <text class="f cap mono" x="864" y="25" text-anchor="end">architecture snapshot</text>
  <g class="line" style="animation-delay:0ms">
    <text class="mono" x="26" y="70" font-size="12.5" fill="#c9821a">$</text>
    <text class="mono" x="46" y="70" font-size="12.5" fill="#201a22">onessh mcp attach --agent coding-agent</text>
  </g>
  <g class="line" style="animation-delay:260ms">
    <text class="mono" x="26" y="92" font-size="12.5" fill="#c9821a">→</text>
    <text class="f cap mono" x="46" y="92">GATEWAY</text>
    <text class="mono" x="160" y="92" font-size="12.5" fill="#5c5158">centralized SSH · one audited entry point</text>
  </g>
  <g class="line" style="animation-delay:520ms">
    <text class="mono" x="26" y="114" font-size="12.5" fill="#c9821a">→</text>
    <text class="f cap mono" x="46" y="114">TOOLS</text>
    <text class="mono" x="160" y="114" font-size="12.5" fill="#5c5158">exec · file_edit · grep · job_start · memory_recall</text>
  </g>
  <g class="line" style="animation-delay:780ms">
    <text class="mono" x="26" y="136" font-size="12.5" fill="#c9821a">→</text>
    <text class="f cap mono" x="46" y="136">CREDENTIALS</text>
    <text class="mono" x="160" y="136" font-size="12.5" fill="#5c5158">vault-held · never handed to the model</text>
  </g>
  <g class="line" style="animation-delay:1040ms">
    <text class="mono" x="26" y="158" font-size="12.5" fill="#c9821a">→</text>
    <text class="f cap mono" x="46" y="158">AUTHZ</text>
    <text class="mono" x="160" y="158" font-size="12.5" fill="#5c5158">per-token host allowlist + tag scopes</text>
  </g>
  <g class="line" style="animation-delay:1300ms">
    <text class="mono" x="26" y="180" font-size="12.5" fill="#c9821a">→</text>
    <text class="f cap mono" x="46" y="180">AUDIT</text>
    <text class="mono" x="160" y="180" font-size="12.5" fill="#5c5158">every call appended to the trail</text>
  </g>
  <g class="line" style="animation-delay:1560ms">
    <text class="mono" x="26" y="202" font-size="12.5" fill="#157f52">✓</text>
    <text class="mono" x="46" y="202" font-size="12.5" fill="#157f52">handshake complete — OneSSH v0.1.13</text>
  </g>
  <g class="line" style="animation-delay:1820ms">
    <text class="mono" x="26" y="224" font-size="12.5" fill="#c9821a">$</text>
    <rect class="caret" x="46" y="214" width="7" height="12" fill="#b34a63"/>
  </g>
  <g opacity=".22">
    <polyline class="drift" points="-160.0,238.0 -147.2,239.3 -134.3,240.3 -121.5,240.5 -108.6,239.8 -95.8,238.4 -82.9,236.8 -70.1,235.5 -57.3,235.0 -44.4,235.6 -31.6,237.0 -18.7,238.8 -5.9,240.5 6.9,241.4 19.8,241.1 32.6,239.7 45.5,237.6 58.3,235.6 71.2,234.4 84.0,234.3 96.8,235.6 109.7,237.7 122.5,240.1 135.4,241.7 148.2,242.2 161.1,241.1 173.9,239.0 186.7,236.4 199.6,234.4 212.4,233.5 225.3,234.2 238.1,236.2 250.9,238.9 263.8,241.3 276.6,242.7 289.5,242.4 302.3,240.6 315.2,237.8 328.0,235.1 340.8,233.4 353.7,233.2 366.5,234.7 379.4,237.3 392.2,240.2 405.1,242.3 417.9,243.0 430.7,241.9 443.6,239.5 456.4,236.5 469.3,234.1 482.1,233.0 494.9,233.7 507.8,235.8 520.6,238.7 533.5,241.3 546.3,242.8 559.2,242.6 572.0,240.9 584.8,238.2 597.7,235.4 610.5,233.6 623.4,233.3 636.2,234.7 649.1,237.1 661.9,239.8 674.7,241.8 687.6,242.5 700.4,241.6 713.3,239.6 726.1,237.0 738.9,234.9 751.8,233.8 764.6,234.3 777.5,235.9 790.3,238.3 803.2,240.4 816.0,241.7 828.8,241.6 841.7,240.4 854.5,238.4 867.4,236.3 880.2,234.9 893.1,234.6 905.9,235.5 918.7,237.2 931.6,239.0 944.4,240.4 957.3,241.0 970.1,240.5 982.9,239.2 995.8,237.6 1008.6,236.2 1021.5,235.5 1034.3,235.7 1047.2,236.7 1060.0,238.0" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
  </g>
</svg>
