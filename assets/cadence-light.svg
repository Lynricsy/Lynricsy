<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="shipping cadence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#efe8ef"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9821a"/>
      <stop offset="1" stop-color="#b34a63"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c9821a" stop-opacity=".62"/>
      <stop offset="1" stop-color="#b34a63" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; }
    .t { fill: #201a22; }
    .d { fill: #5c5158; }
    .f { fill: #8d8189; }
    .title { font-size: 13px; font-weight: 600; letter-spacing: .06em; }
    .kpi { font-size: 22px; font-weight: 700; }
    .cap { font-size: 9.5px; letter-spacing: .12em; }
    .sm { font-size: 10.5px; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    .drift { animation: drift 14s linear infinite; }
    .glow { animation: glow 4.5s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.22,1,.36,1) both; }
    .rise { transform-box: fill-box; transform-origin: bottom center; animation: rise 1.1s cubic-bezier(.22,1,.36,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.22,1,.36,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .drift, .glow, .grow, .rise, .pop { animation: none; }
      .grow, .rise, .pop { transform: none; opacity: 1; }
    }

  </style>
  <rect width="430" height="250" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="429" height="249" rx="13.5" fill="none" stroke="#ded3d0"/>
  <rect x="14" y="14" width="3" height="14" rx="1.5" fill="url(#edge)"/>
  <text class="t title" x="26" y="25">shipping cadence</text>
  <text class="f cap mono" x="414" y="25" text-anchor="end">12m</text>
  <text class="t kpi mono" x="26" y="72">91</text>
  <text class="f cap mono" x="26" y="87">RELEASES 12M</text>
  <text class="t kpi mono" x="158" y="72">9</text>
  <text class="f cap mono" x="158" y="87">REPOS SHIPPING</text>
  <text class="t kpi mono" x="290" y="72">68</text>
  <text class="f cap mono" x="290" y="87">BUSIEST MONTH</text>
  <text class="f cap mono" x="26" y="108">TAGGED RELEASES PER MONTH</text>
  <rect class="rise" x="32.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:0ms"/>
  <rect class="rise" x="63.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:55ms"/>
  <rect class="rise" x="94.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:110ms"/>
  <rect class="rise" x="125.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:165ms"/>
  <rect class="rise" x="156.0" y="173.8" width="23.0" height="20.2" rx="2" fill="url(#fade)" style="animation-delay:220ms"/>
  <text class="f cap mono" x="167.5" y="168.8" text-anchor="middle">6</text>
  <rect class="rise" x="187.0" y="177.5" width="23.0" height="16.5" rx="2" fill="url(#fade)" style="animation-delay:275ms"/>
  <text class="f cap mono" x="198.5" y="172.5" text-anchor="middle">4</text>
  <rect class="rise" x="218.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:330ms"/>
  <rect class="rise" x="249.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:385ms"/>
  <rect class="rise" x="280.0" y="192.0" width="23.0" height="2.0" rx="2" fill="#e7dcdb" style="animation-delay:440ms"/>
  <rect class="rise" x="311.0" y="167.9" width="23.0" height="26.1" rx="2" fill="url(#fade)" style="animation-delay:495ms"/>
  <text class="f cap mono" x="322.5" y="162.9" text-anchor="middle">10</text>
  <rect class="rise" x="342.0" y="179.7" width="23.0" height="14.3" rx="2" fill="url(#fade)" style="animation-delay:550ms"/>
  <text class="f cap mono" x="353.5" y="174.7" text-anchor="middle">3</text>
  <rect class="rise" x="373.0" y="126.0" width="23.0" height="68.0" rx="2" fill="url(#fade)" style="animation-delay:605ms"/>
  <text class="f cap mono" x="384.5" y="121.0" text-anchor="middle">68</text>
  <line x1="32" y1="195" x2="404" y2="195" stroke="#e7dcdb" stroke-width="1"/>
  <text class="f cap mono" x="43.5" y="211" text-anchor="middle">09</text>
  <text class="f cap mono" x="74.5" y="211" text-anchor="middle">10</text>
  <text class="f cap mono" x="105.5" y="211" text-anchor="middle">11</text>
  <text class="f cap mono" x="136.5" y="211" text-anchor="middle">12</text>
  <text class="f cap mono" x="167.5" y="211" text-anchor="middle">01</text>
  <text class="f cap mono" x="198.5" y="211" text-anchor="middle">02</text>
  <text class="f cap mono" x="229.5" y="211" text-anchor="middle">03</text>
  <text class="f cap mono" x="260.5" y="211" text-anchor="middle">04</text>
  <text class="f cap mono" x="291.5" y="211" text-anchor="middle">05</text>
  <text class="f cap mono" x="322.5" y="211" text-anchor="middle">06</text>
  <text class="f cap mono" x="353.5" y="211" text-anchor="middle">07</text>
  <text class="f cap mono" x="384.5" y="211" text-anchor="middle">08</text>
  <text class="f cap mono" x="26" y="238">92 RELEASES ON RECORD ACROSS ALL REPOS</text>
</svg>
