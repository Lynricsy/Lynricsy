<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-labelledby="ot">
<title id="ot">Decorative astrolabe: orbits and sound rings turning around a small signal core.</title>
<defs>
<linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="26" y1="26" x2="194" y2="194"><stop offset="0" stop-color="#ffc857" stop-opacity="0.85"/><stop offset="0.36" stop-color="#ff8f6b" stop-opacity="0.85"/><stop offset="0.7" stop-color="#e5657f" stop-opacity="0.85"/><stop offset="1" stop-color="#8d5a86" stop-opacity="0.85"/></linearGradient>
<linearGradient id="ad" gradientUnits="userSpaceOnUse" x1="194" y1="26" x2="26" y2="194"><stop offset="0" stop-color="#ffc857" stop-opacity="0.85"/><stop offset="0.5" stop-color="#e5657f" stop-opacity="0.85"/><stop offset="1" stop-color="#8d5a86" stop-opacity="0.85"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#ff8f6b" stop-opacity="0.2"/><stop offset="0.55" stop-color="#ff8f6b" stop-opacity="0.07"/><stop offset="1" stop-color="#ff8f6b" stop-opacity="0"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffc857" stop-opacity="0.5"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
</defs>
<style>.sp1{animation:s1 12s linear infinite}.sp2{animation:s2 14s linear infinite}.orb1{animation:o1 16s linear infinite}.orb2{animation:o2 12s linear infinite}.pl1{animation:pl 9s ease-out infinite}.pl2{animation:pl 9s ease-out infinite;animation-delay:-4.5s}.core{animation:co 10s ease-in-out infinite}.arc{animation:ar 13s ease-in-out infinite}.plate{animation:br 16s ease-in-out infinite}.sp1,.sp2,.orb1,.orb2,.pl1,.pl2{transform-box:view-box;transform-origin:110.0px 110.0px}@keyframes s1{from{transform:rotate(0)}to{transform:rotate(10.0000deg)}}@keyframes s2{from{transform:rotate(0)}to{transform:rotate(-15.0000deg)}}@keyframes o1{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes o2{from{transform:rotate(0)}to{transform:rotate(-360deg)}}@keyframes pl{0%{transform:scale(.26);opacity:.34}100%{transform:scale(1);opacity:0}}@keyframes co{0%,100%{opacity:.62}50%{opacity:.95}}@keyframes ar{0%,100%{opacity:.3}50%{opacity:.6}}@keyframes br{0%,100%{opacity:.82}50%{opacity:1}}@media (prefers-reduced-motion: reduce){.sp1,.sp2,.orb1,.orb2,.pl1,.pl2,.core,.arc,.plate{animation:none}}</style>
