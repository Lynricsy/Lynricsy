name: profile

# 每天重建主页的数据卡与动态区块。
# 只在产物真的变了时才提交，避免机器人 commit 刷满贡献图。
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/build-profile.mjs
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成卡片与 README 区块
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-profile.mjs

      - name: 有变更才提交
        run: |
          set -euo pipefail
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          # 刻意不写 local git config：只在这一条命令上附加身份。
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(profile): 🤖 refresh signal cards and activity blocks"
          git push
